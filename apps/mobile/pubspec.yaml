name: sinaaty
description: "صناعية — Sinaaty mobile (customer | partner | fleet flavors)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # state / DI
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  # routing
  go_router: ^16.0.0
  # networking
  dio: ^5.9.0
  # models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  # storage / platform
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  # utils
  intl: any
  decimal: ^3.2.0
  uuid: ^4.5.1
  collection: ^1.19.0
  socket_io_client: ^3.1.6
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  # قراءة الاستمارة على الجهاز نفسه: الوثيقة تحمل اسم المالك ورقم هويته، وإرسالها إلى خدمة
  # خارجية قرارُ إقامة بيانات لا ميزة منتج (§5.4). ML Kit يقرأ بلا شبكة إطلاقاً.
  google_mlkit_text_recognition: ^0.15.0
  crypto: ^3.0.7
  mobile_scanner: ^7.4.0
  speech_to_text: ^7.4.0
  record: ^7.1.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  riverpod_generator: ^3.0.0
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  import_lint: ^0.1.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
