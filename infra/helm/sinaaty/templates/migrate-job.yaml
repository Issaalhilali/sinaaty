{{- if .Values.migrations.enabled }}
# Schema changes run once per release, before the new pods start (never on app boot).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations: { "helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-weight": "-5", "helm.sh/hook-delete-policy": before-hook-creation }
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/api:{{ .Values.image.tag }}"
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
{{- end }}
