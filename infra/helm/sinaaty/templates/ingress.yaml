{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: { nginx.ingress.kubernetes.io/proxy-body-size: "20m" }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls: [{ hosts: ["{{ .Values.ingress.apiHost }}", "{{ .Values.ingress.adminHost }}"], secretName: {{ .Release.Name }}-tls }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.apiHost }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { number: 80 } } } }] }
    - host: {{ .Values.ingress.adminHost }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-admin, port: { number: 80 } } } }] }
{{- end }}
