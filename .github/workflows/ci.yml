name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.14.0'

jobs:
  # ---------------------------------------------------------------- shared packages (pure domain libs)
  packages:
    name: packages (ledger · zatca-ubl · shared-types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" lint
      - run: pnpm --filter "./packages/*" test
      - run: pnpm --filter "./packages/*" build

  # ---------------------------------------------------------------- API: schema truth, unit, e2e (real Postgres+PostGIS)
  api:
    name: api (lint · typecheck · db:verify · unit · e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env: { POSTGRES_USER: sinaaty, POSTGRES_PASSWORD: sinaaty, POSTGRES_DB: sinaaty }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sinaaty" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://sinaaty:sinaaty@localhost:5432/sinaaty?schema=public
      DIRECT_DATABASE_URL: postgresql://sinaaty:sinaaty@localhost:5432/sinaaty?schema=public
      REDIS_URL: redis://localhost:6379
      PII_ENC_KEY: dGVzdC1vbmx5LTMyLWJ5dGUta2V5LWZvci1jaS0xMjM0NTY=
      APP_ENV: test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Ed25519 keys are generated per run — never committed, never reused across environments.
      - name: Generate JWT keys
        run: node apps/api/tools/gen-jwt-keys.mjs >> "$GITHUB_ENV"
      - run: pnpm --filter api prisma:generate
      - name: Database is the source of truth (schema.sql → migration → seed → no drift)
        run: pnpm --filter api db:verify
      - run: pnpm --filter api lint
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api test
      - run: pnpm --filter api test:e2e
      # Contract artefacts: OpenAPI + generated enums must match the code that produced them.
      - run: pnpm --filter api openapi:export
      - run: pnpm --filter shared-types gen:check
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: openapi, path: packages/shared-types/openapi.json, if-no-files-found: warn }

  # ---------------------------------------------------------------- admin back-office + Playwright smoke against the real API
  admin-web:
    name: admin-web (typecheck · build · smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env: { POSTGRES_USER: sinaaty, POSTGRES_PASSWORD: sinaaty, POSTGRES_DB: sinaaty }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sinaaty" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://sinaaty:sinaaty@localhost:5432/sinaaty?schema=public
      PII_ENC_KEY: dGVzdC1vbmx5LTMyLWJ5dGUta2V5LWZvci1jaS0xMjM0NTY=
      APP_ENV: dev
      PORT: '3000'
      API_BASE_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3001
      JOBS_ENABLED: 'false'
      # Every e2e suite logs in as the same seeded accounts, so one CI run mints far more codes for them
      # than a person ever would. The production default is 3 (see env.schema.ts) and stays 3.
      OTP_MAX_REQUESTS_PER_10MIN: '2000'
      # Same reason: every suite calls the API from the runner's single address.
      THROTTLE_LIMIT: '100000'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node apps/api/tools/gen-jwt-keys.mjs >> "$GITHUB_ENV"
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api prisma:deploy && pnpm --filter api seed
      - run: pnpm --filter admin-web typecheck
      - run: pnpm --filter admin-web build
      - name: Start API + admin-web
        run: |
          pnpm --filter api build
          node apps/api/dist/main.js & echo $! > /tmp/api.pid
          pnpm --filter admin-web start & echo $! > /tmp/web.pid
          npx --yes wait-on http://localhost:3000/v1/health http://localhost:3001/login --timeout 120000
      - run: pnpm --filter admin-web exec playwright install --with-deps chromium
      - run: pnpm --filter admin-web test:e2e
        env: { ADMIN_URL: 'http://localhost:3001' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/admin-web/test-results, if-no-files-found: ignore }

  # ---------------------------------------------------------------- Flutter apps (customer · partner · fleet)
  mobile:
    name: mobile (analyze · import_lint · test)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: dart run import_lint          # Clean Architecture dependency rule (CLAUDE.md §5.5)
      - run: flutter test                  # includes RTL goldens rendered with the real Arabic font

  # ---------------------------------------------------------------- container images (built only after everything is green)
  images:
    name: images (api · admin-web)
    needs: [packages, api, admin-web, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { app: api, dockerfile: apps/api/Dockerfile }
          - { app: admin-web, dockerfile: apps/admin-web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
